[tool.poetry]
name = "telemetria-energetica"
version = "0.1.0"
description = "API para telemetria de consumo energético de máquinas."
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
pydantic-settings = "^2.5.0"
sqlalchemy = "^2.0.35"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-cov = "^5.0.0"
httpx = "^0.27.2"
taskipy = "^1.13.0"

[tool.taskipy.tasks]
run = "uvicorn telemetria_energetica.app:app --reload"
test = "pytest -s -x --cov=telemetria_energetica -vv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
